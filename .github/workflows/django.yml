name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipswich_db
          POSTGRES_USER: ipswich_user
          POSTGRES_PASSWORD: ipswich_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: "django-ci-test-secret-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "postgres://ipswich_user:ipswich_pass@localhost:5432/ipswich_db"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 safety

      - name: Run Flake8 Code Quality Linter
        run: |
          flake8 .

      - name: Run Dependency Security Audit (Safety)
        run: |
          safety check || echo "Security audit completed (non-blocking informational scan)"

      - name: Run Django System Checks
        run: |
          python manage.py check

      - name: Apply Database Migrations (PostgreSQL)
        run: |
          python manage.py migrate

      - name: Validate Product Fixture Seeding
        run: |
          python manage.py loaddata products

      - name: Run Automated Test Suite with Coverage
        run: |
          coverage run manage.py test
          coverage report -m

      - name: Test Production Static Asset Collection
        run: |
          python manage.py collectstatic --noinput

  docker:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          docker build -t ipswich-retail:ci .

      - name: Verify Container Healthcheck Probe
        run: |
          docker run -d --name test-app -p 8000:8000 -e SECRET_KEY="ci-healthcheck-key" ipswich-retail:ci
          sleep 5
          curl -f http://localhost:8000/health/ || exit 1
          docker stop test-app

  deploy:
    name: Continuous Deployment (Render)
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Cloud Platform Deployment Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
