name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Django Build, Test & Coverage
    runs-on: ubuntu-latest

    env:
      DEBUG: "True"
      SECRET_KEY: "django-ci-test-secret-key-safe-for-testing"
      ALLOWED_HOSTS: "*"
      SECURE_SSL_REDIRECT: "False"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Flake8 Code Linter
        run: |
          flake8 --ignore=E501,W503 --exclude=.git,__pycache__,.venv,venv,migrations,sections_text.py,build_full_report.py --exit-zero

      - name: Django System Configuration Check
        run: |
          python manage.py check

      - name: Apply Database Migrations
        run: |
          python manage.py migrate

      - name: Verify Fixture Data Seeding
        run: |
          python manage.py loaddata products

      - name: Run Automated Test Suite with Coverage
        run: |
          coverage run manage.py test
          coverage report -m

      - name: Verify Static Asset Collection
        run: |
          python manage.py collectstatic --noinput
